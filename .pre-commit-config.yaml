# pip install pre-commit && pre-commit install   - catches secrets and obvious flaws before they leave the laptop.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-ll", "-q", "-r", "backend/app"]
        pass_filenames: false
