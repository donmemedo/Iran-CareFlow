name: careflow-iran

# Hardening applied to every service: no new privileges, all capabilities dropped (db keeps the few
# its entrypoint needs), read-only root filesystem where the image allows it, bounded memory and pids,
# loopback-only published ports. The database sits on an internal network with no route out.
x-hardened: &hardened
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 256
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardened
    image: postgres:16-alpine
    cap_drop: []                       # the stock entrypoint chowns the data dir before dropping to postgres
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-careflow}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careflow} -d ${POSTGRES_DB:-careflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  api:
    <<: *hardened
    build:
      context: ./backend
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-careflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-careflow}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (>= 32 random chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100,http://127.0.0.1:3100}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-careflow}
    ports:
      - "127.0.0.1:${API_PORT:-8008}:8000"
    networks: [edge, backend]

  web:
    <<: *hardened
    build:
      context: ./frontend
      args:
        # Baked into the client bundle: this is the URL the browser calls,
        # so it must be reachable from the host, not from inside the network.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8008/api/v1}
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/app/.next/cache:rw,noexec,nosuid,size=128m"]
    mem_limit: 512m
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    networks: [edge]

volumes:
  db-data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true                     # no outbound route: a compromised db/api path cannot call home
