<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آفلاین · CareFlow</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; font-family: system-ui, sans-serif;
         background:#f4f6f8; color:#0d141c; text-align:center; padding:24px; }
  @media (prefers-color-scheme: dark) { body { background:#070a0e; color:#f1f5f9; } }
  .card { max-width:420px; }
  h1 { font-size:1.25rem; margin:0 0 12px; }
  p { font-size:.875rem; line-height:2; opacity:.75; margin:0; }
  .dot { width:52px; height:52px; border-radius:16px; margin:0 auto 20px;
         background:linear-gradient(140deg,#14a39a,#0d666c); }
</style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>ارتباط با شبکه برقرار نیست</h1>
    <p>اتصال اینترنت یا شبکه داخلی بیمارستان را بررسی کنید و دوباره تلاش کنید.<br>
       Check your connection and try again.</p>
  </div>
</body>
</html>
